version: 1
rules:
  # Illustrative parser: choose the OID and expression from an actual SRX5800 walk.
  # This matches Juniper devices in a site-specific network and extracts a model
  # from sysDescr only when normal discovery did not report a model.
  - id: juniper-srx-from-description
    match:
      sys_object_id_prefix: '1.3.6.1.4.1.2636'
      sys_descr_regex: '(?i)\bSRX5800\b'
    mode: fallback
    fields:
      model:
        source: sysDescr
        regex: '(?i)\b(SRX5800)\b'
        group: 1

  # To extract a model from a vendor subtree instead, use this shape:
  # - id: custom-model-location
  #   match:
  #     network: '192.0.2.0/24'
  #     manufacturer: Juniper
  #   fields:
  #     model:
  #       oid: '1.3.6.1.2.1.47.1.1.1.1.2'
  #       walk: true
  #       regex: '(?i)\b(SRX5800)\b'
  #       group: 1

  # A model OID with an optional filter regex. Without a capture group the regex only
  # filters: the first value that matches is kept whole (here the chassis row of
  # entPhysicalModelName, not power supplies or network modules). Omit regex to take
  # the first non-empty value.
  # - id: catalyst-9300-model
  #   match:
  #     sys_object_id_prefix: '1.3.6.1.4.1.9'
  #   mode: replace
  #   fields:
  #     model:
  #       oid: '1.3.6.1.2.1.47.1.1.1.1.13'
  #       walk: true
  #       regex: '^C9300-\d+[A-Z]*$'
