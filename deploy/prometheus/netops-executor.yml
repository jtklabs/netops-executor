scrape_configs:
  - job_name: netops-executor
    scrape_interval: 30s
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      # NETOPS_METRICS_TOKEN: opens /metrics only, never the job or credential API.
      credentials_file: /etc/prometheus/secrets/netops-executor-metrics-token
    static_configs:
      - targets:
          - netops-executor.example.net
