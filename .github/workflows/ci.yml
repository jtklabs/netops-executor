name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Tests run locally before pushing. Run them here on demand from the Actions tab.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: ruff check . && ruff format --check .
      - run: node --check netops_executor/static/app.js
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t netops-executor:test .
      - run: docker run --rm netops-executor:test netops-executor --help
      - run: docker run --rm --cap-drop ALL netops-executor:test nmap --version
